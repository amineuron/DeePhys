[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deephys-python-companion"
version = "0.1.0"
description = "Python post-sorting analysis companion with function-level MATLAB validation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.13", "pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8", "networkx>=3.2"]

[project.optional-dependencies]
embedding = ["umap-learn>=0.5.7"]
communities = ["igraph>=0.11", "leidenalg>=0.10"]
test = ["pytest>=8"]

[project.scripts]
deephys-python = "deephys.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
