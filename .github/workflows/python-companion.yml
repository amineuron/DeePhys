name: Python companion numerical tests
on:
  push:
    branches: [python-port]
  pull_request:
    paths: ['python/**', 'pyproject.toml', '.github/workflows/python-companion.yml']
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m pytest python/tests -q
